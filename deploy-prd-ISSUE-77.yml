schedules:
- cron: "5 2 17 11 *"
  displayName: Production deployment for ISSUE-77
  branches:
    include:
    - main
  always: true

trigger: none

pool:
  name: NicolasHosted

variables:
  DBM_JAR_PATH: 'C:\Program Files (x86)\DBmaestro\DOP Server\Agent\DBmaestroAgent.jar'
  DBM_AGENT_ENDPOINT: 'localhost:8017'
  DBM_ENV_NAME_PROD: 'PRD'
  DBM_PROJECT_NAME: 'Demo-MSSQL'
  DBM_AUTH_TYPE: 'DBmaestroAccount'
  PACKAGE_NAME: 'ISSUE-77'

stages:
- stage: DeployPRD
  displayName: 'Deploy to Production'
  jobs:
  - job: ProductionDeploy
    displayName: 'Production Deployment'
    steps:
    - powershell: |
        Write-Host "=== Production Deployment Started ==="
        Write-Host "Package: $(PACKAGE_NAME)"
        Write-Host "Environment: $(DBM_ENV_NAME_PROD)"
        Write-Host "Deployment Time: $(Get-Date)"
        Write-Host ""
      displayName: 'Display Deployment Information'
    
    - powershell: |
        Write-Host "Deploying package: $(PACKAGE_NAME) to Production"
        java -jar "$(DBM_JAR_PATH)" -Upgrade `
          -ProjectName "$(DBM_PROJECT_NAME)" `
          -EnvName "$(DBM_ENV_NAME_PROD)" `
          -PackageName "$(PACKAGE_NAME)" `
          -BackupBehavior True `
          -RestoreBehavior True `
          -Server "$(DBM_AGENT_ENDPOINT)" `
          -UseSSL True `
          -AuthType "$(DBM_AUTH_TYPE)" `
          -UserName "$(DBMUsername)" `
          -Password "$(DBMPassword)"
      displayName: 'Deploy to Production'
    
    - powershell: |
        Write-Host "=== Production Deployment Complete ==="
        Write-Host "Package: $(PACKAGE_NAME)"
        Write-Host "Status: SUCCESS"
        Write-Host "Completed: $(Get-Date)"
      displayName: 'Deployment Summary'

