schedules:
- cron: "CRON_SCHEDULE_PLACEHOLDER"
  displayName: Production deployment for PACKAGE_NAME_PLACEHOLDER
  branches:
    include:
    - main
  always: true

trigger: none

name: DBmaestro Production Deployment - PACKAGE_NAME_PLACEHOLDER

pool:
  name: AdoHosted

variables:
  - group: DBmaestro-Credentials
  - name: DBM_JAR_PATH
    value: 'C:\Program Files (x86)\DBmaestro\DOP Server\Agent\DBmaestroAgent.jar'
  - name: DBM_AGENT_ENDPOINT
    value: 'localhost:8017'
  - name: DBM_ENV_NAME_PROD
    value: 'PRD'
  - name: DBM_PROJECT_NAME
    value: 'Demo-MSSQL'
  - name: DBM_AUTH_TYPE
    value: 'DBmaestroAccount'
  - name: PACKAGE_NAME
    value: 'PACKAGE_NAME_PLACEHOLDER'

stages:
- stage: DeployPRD
  displayName: 'Deploy to Production'
  jobs:
  - job: ProductionDeploy
    displayName: 'Production Deployment'
    steps:
    - powershell: |
        Write-Host "=== Production Deployment Started ==="
        Write-Host "Package: $(PACKAGE_NAME)"
        Write-Host "Environment: $(DBM_ENV_NAME_PROD)"
        Write-Host "Deployment Time: $(Get-Date)"
        Write-Host ""
      displayName: 'Display Deployment Information'
    
    - powershell: |
        Write-Host "Deploying package: $(PACKAGE_NAME) to Production"
        java -jar "$(DBM_JAR_PATH)" -Upgrade `
          -ProjectName "$(DBM_PROJECT_NAME)" `
          -EnvName "$(DBM_ENV_NAME_PROD)" `
          -PackageName "$(PACKAGE_NAME)" `
          -BackupBehavior True `
          -RestoreBehavior True `
          -Server "$(DBM_AGENT_ENDPOINT)" `
          -AuthType "$(DBM_AUTH_TYPE)" `
          -UserName "$(DBMUsername)" `
          -Password "$(DBMPassword)"
      displayName: 'Deploy to Production'
    
    - powershell: |
        Write-Host "=== Production Deployment Complete ==="
        Write-Host "Package: $(PACKAGE_NAME)"
        Write-Host "Status: SUCCESS"
        Write-Host "Completed: $(Get-Date)"
      displayName: 'Deployment Summary'
