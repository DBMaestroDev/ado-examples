trigger: none

resources:
  repositories:
    - repository: ado-source-control
      type: git
      name: 'ado-source-control'  # Format: 'ProjectName/RepoName'
      trigger:
        branches:
          include:
          - main
          - develop
pool:
  name: NicolasHosted

variables:
  dbmaestroVersion: '2024.1.0'
  packageName: '$(Build.Repository.Name)-$(Build.BuildNumber)'
  releaseSourceEnvironment: 'release-source'
  DBM_JAR_PATH: 'C:\Program Files (x86)\DBmaestro\DOP Server\Agent\DBmaestroAgent.jar'
  DBM_AGENT_ENDPOINT: 'localhost:8017'
  DBM_ENV_NAME_DEV: 'DEV_USER'
  DBM_ENV_NAME_RS: 'DEV'
  DBM_ENV_NAME_QA: 'QAS'
  DBM_ENV_NAME_PROD: 'PRD'
  DBM_PROJECT_NAME: 'Demo-MSSQL'
  DBM_AUTH_TYPE: 'DBmaestroAccount'
  agent.diagnostic: false

stages:
- stage: ExtractTaskID
  displayName: 'Extract TaskID from Commit Message'
  jobs:
  - job: TaskIDExtraction
    displayName: 'Extract TaskID'
    steps:
    - powershell: |
        # Extract TaskID from commit message
        $commitMessage = "$(Build.SourceVersionMessage)"
        Write-Host "Commit Message: $commitMessage"
        
        if ($commitMessage -match 'TaskID:\s*([A-Za-z0-9_-]+)') {
          $taskId = $matches[1]
          Write-Host "Extracted TaskID: $taskId"
          Write-Output "##vso[task.setvariable variable=EXTRACTED_PACKAGE_NAME isOutput=true]$taskId"
          # Also write to a file for other stages to read
          $taskId | Out-File -FilePath "$(Build.ArtifactStagingDirectory)/taskid.txt" -NoNewline -Force
        } else {
          Write-Error "TaskID not found in commit message. Commit message must contain 'TaskID: <value>'"
          exit 1
        }
      displayName: 'Extract TaskID from Commit Message'
      name: ExtractTaskId
    
    - publish: $(Build.ArtifactStagingDirectory)/taskid.txt
      artifact: taskid-artifact
      displayName: 'Publish TaskID Artifact'

- stage: CreatePackage
  displayName: 'Create DBmaestro Package'
  dependsOn:
  - ExtractTaskID
  condition: succeeded()
  jobs:
  - job: PackageCreation
    displayName: 'Create Package'
    steps:
    - download: current
      artifact: taskid-artifact
      displayName: 'Download TaskID Artifact'
    
    - powershell: |
        $taskIdContent = Get-Content "$(Pipeline.Workspace)/taskid-artifact/taskid.txt" -Raw
        $taskId = $taskIdContent.Trim()
        Write-Host "Read TaskID from artifact: $taskId"
        Write-Output "##vso[task.setvariable variable=EXTRACTED_PACKAGE_NAME]$taskId"
      displayName: 'Load TaskID from Artifact'
    
    - script: |
        echo Package Name: $(EXTRACTED_PACKAGE_NAME)
        echo Build ID: $(Build.BuildId)
        echo Repository: $(Build.Repository.Name)
      displayName: 'Display Build Information'
    
    - powershell: |
        Write-Host "Debug - EXTRACTED_PACKAGE_NAME variable: $(EXTRACTED_PACKAGE_NAME)"
        if ([string]::IsNullOrWhiteSpace("$(EXTRACTED_PACKAGE_NAME)")) {
          Write-Error "EXTRACTED_PACKAGE_NAME is empty!"
          exit 1
        }
      displayName: 'Validate Package Name'
    
    - powershell: |
        java -jar "$(DBM_JAR_PATH)" -Build `
          -ProjectName "$(DBM_PROJECT_NAME)" `
          -EnvName "$(DBM_ENV_NAME_DEV)" `
          -VersionType "Tasks" `
          -AdditionalInformation "$(EXTRACTED_PACKAGE_NAME)" `
          -CreatePackage True `
          -PackageName "$(EXTRACTED_PACKAGE_NAME)" `
          -Server "$(DBM_AGENT_ENDPOINT)" `
          -UseSSL True `
          -AuthType "$(DBM_AUTH_TYPE)" `
          -UserName "$(DBMUsername)" `
          -Password "$(DBMPassword)"

      displayName: 'Create DBmaestro Package'
# -CreateDowngradeScripts True `
# we need to add this later

- stage: RunPrecheck
  displayName: 'Run DBmaestro Precheck'
  dependsOn:
  - CreatePackage
  condition: succeeded()
  jobs:
  - job: PrecheckValidation
    displayName: 'Validate Package'
    steps:
    - download: current
      artifact: taskid-artifact
      displayName: 'Download TaskID Artifact'
    
    - powershell: |
        $taskIdContent = Get-Content "$(Pipeline.Workspace)/taskid-artifact/taskid.txt" -Raw
        $taskId = $taskIdContent.Trim()
        Write-Host "Read TaskID from artifact: $taskId"
        Write-Output "##vso[task.setvariable variable=EXTRACTED_PACKAGE_NAME]$taskId"
      displayName: 'Load TaskID from Artifact'
    
    - powershell: |
        java -jar "$(DBM_JAR_PATH)" -PreCheck `
          -ProjectName "$(DBM_PROJECT_NAME)" `
          -Server "$(DBM_AGENT_ENDPOINT)" `
          -PackageName "$(EXTRACTED_PACKAGE_NAME)" `
          -UseSSL True `
          -AuthType "$(DBM_AUTH_TYPE)" `
          -UserName "$(DBMUsername)" `
          -Password "$(DBMPassword)"
      displayName: 'Run DBmaestro Precheck'

- stage: UpgradeReleaseSource
  displayName: 'Upgrade Release Source Environment'
  dependsOn:
  - RunPrecheck
  condition: succeeded()
  jobs:
  - job: DeployToReleaseSource
    displayName: 'Deploy Package to Release Source'
    steps:
    - download: current
      artifact: taskid-artifact
      displayName: 'Download TaskID Artifact'
    
    - powershell: |
        $taskIdContent = Get-Content "$(Pipeline.Workspace)/taskid-artifact/taskid.txt" -Raw
        $taskId = $taskIdContent.Trim()
        Write-Host "Read TaskID from artifact: $taskId"
        Write-Output "##vso[task.setvariable variable=EXTRACTED_PACKAGE_NAME]$taskId"
      displayName: 'Load TaskID from Artifact'
    
    - powershell: |
        java -jar "$(DBM_JAR_PATH)" -Upgrade `
          -ProjectName "$(DBM_PROJECT_NAME)" `
          -EnvName "$(DBM_ENV_NAME_RS)" `
          -PackageName "$(EXTRACTED_PACKAGE_NAME)" `
          -BackupBehavior True `
          -RestoreBehavior True `
          -Server "$(DBM_AGENT_ENDPOINT)" `
          -UseSSL True `
          -AuthType "$(DBM_AUTH_TYPE)" `
          -UserName "$(DBMUsername)" `
          -Password "$(DBMPassword)"
      displayName: 'Upgrade Release Source Environment'
    
    - script: |
        echo Deployment Summary:
        echo Package: $(EXTRACTED_PACKAGE_NAME)
        echo Environment: $(DBM_ENV_NAME_RS)
        echo Status: SUCCESS
      displayName: 'Display Deployment Summary'

- stage: ApprovalForQAS
  displayName: 'Approval: Proceed to QAS'
  dependsOn:
  - UpgradeReleaseSource
  condition: succeeded()
  jobs:
  - job: ApprovalJob
    displayName: 'Manual Approval'
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: 'nicolast@dbmaestro.com'
        instructions: 'Please review the Release Source deployment and approve to proceed with QAS upgrade.'
        onTimeout: 'reject'

- stage: UpgradeQAS
  displayName: 'Upgrade QAS Environment'
  dependsOn:
  - ApprovalForQAS
  condition: succeeded()
  jobs:
  - job: DeployToQAS
    displayName: 'Deploy Package to QAS'
    steps:
    - download: current
      artifact: taskid-artifact
      displayName: 'Download TaskID Artifact'
    
    - powershell: |
        $taskIdContent = Get-Content "$(Pipeline.Workspace)/taskid-artifact/taskid.txt" -Raw
        $taskId = $taskIdContent.Trim()
        Write-Host "Read TaskID from artifact: $taskId"
        Write-Output "##vso[task.setvariable variable=EXTRACTED_PACKAGE_NAME]$taskId"
      displayName: 'Load TaskID from Artifact'
    
    - powershell: |
        java -jar "$(DBM_JAR_PATH)" -Upgrade `
          -ProjectName "$(DBM_PROJECT_NAME)" `
          -EnvName "$(DBM_ENV_NAME_QA)" `
          -PackageName "$(EXTRACTED_PACKAGE_NAME)" `
          -BackupBehavior True `
          -RestoreBehavior True `
          -Server "$(DBM_AGENT_ENDPOINT)" `
          -UseSSL True `
          -AuthType "$(DBM_AUTH_TYPE)" `
          -UserName "$(DBMUsername)" `
          -Password "$(DBMPassword)"
      displayName: 'Upgrade QAS Environment'
    
    - script: |
        echo Deployment Summary:
        echo Package: $(EXTRACTED_PACKAGE_NAME)
        echo Environment: $(DBM_ENV_NAME_QA)
        echo Status: SUCCESS
      displayName: 'Display QAS Deployment Summary'

- stage: SchedulePRDUpgrade
  displayName: 'Schedule PRD Upgrade'
  dependsOn:
  - UpgradeQAS
  condition: succeeded()
  jobs:
  - job: SetDeploymentTime
    displayName: 'Set Production Deployment Time'
    pool: server
    timeoutInMinutes: 1440
    steps:
    - task: ManualValidation@0
      inputs:
        notifyUsers: 'nicolast@dbmaestro.com'
        instructions: 'QAS deployment completed successfully. Please review and specify the production deployment schedule. To set a custom date, add variable "TargetDeploymentDate" with format: "2025-11-17 14:30:00" (YYYY-MM-DD HH:MM:SS). Default if not specified: Tomorrow at 2 AM.'
        onTimeout: 'reject'
  
  - job: ScheduleUpgrade
    displayName: 'Schedule Production Upgrade'
    dependsOn: SetDeploymentTime
    steps:
    - checkout: self
      persistCredentials: true
      displayName: 'Checkout Repository'
    
    - download: current
      artifact: taskid-artifact
      displayName: 'Download TaskID Artifact'
    
    - powershell: |
        $taskIdContent = Get-Content "$(Pipeline.Workspace)/taskid-artifact/taskid.txt" -Raw
        $taskId = $taskIdContent.Trim()
        Write-Host "Read TaskID from artifact: $taskId"
        Write-Output "##vso[task.setvariable variable=EXTRACTED_PACKAGE_NAME]$taskId"
      displayName: 'Load TaskID from Artifact'
    
    - powershell: |
        $packageName = "$(EXTRACTED_PACKAGE_NAME)"
        
        # Check if custom date provided via pipeline variable, otherwise use default
        $targetDateInput = "$(TargetDeploymentDate)"
        
        if ([string]::IsNullOrWhiteSpace($targetDateInput)) {
          # Default: tomorrow at 2 AM
          $targetDate = (Get-Date).Date.AddDays(1).AddHours(2)
          Write-Host "No custom date provided. Using default: $targetDate"
        } else {
          try {
            $targetDate = [DateTime]::Parse($targetDateInput)
            Write-Host "Using custom deployment date: $targetDate"
          } catch {
            Write-Warning "Failed to parse custom date '$targetDateInput'. Using default."
            $targetDate = (Get-Date).Date.AddDays(1).AddHours(2)
          }
        }
        
        $cronSchedule = "$($targetDate.Minute) $($targetDate.Hour) $($targetDate.Day) $($targetDate.Month) *"
        Write-Host "Package: $packageName"
        Write-Host "Scheduled deployment time: $targetDate"
        Write-Host "Cron schedule: $cronSchedule"
        Write-Host ""
        
        # Read template
        $templatePath = "$(Build.SourcesDirectory)/deploy-prd-template.yml"
        if (-not (Test-Path $templatePath)) {
          Write-Error "Template file not found: $templatePath"
          exit 1
        }
        
        $template = Get-Content $templatePath -Raw
        
        # Replace placeholders
        $customPipeline = $template `
          -replace 'CRON_SCHEDULE_PLACEHOLDER', $cronSchedule `
          -replace 'PACKAGE_NAME_PLACEHOLDER', $packageName
        
        # Save as new file
        $pipelineFileName = "deploy-prd-$packageName.yml"
        $pipelinePath = "$(Build.SourcesDirectory)/$pipelineFileName"
        $customPipeline | Out-File -FilePath $pipelinePath -Encoding UTF8 -Force
        
        Write-Host "Created pipeline file: $pipelineFileName"
        Write-Host "Pipeline path: $pipelinePath"
        Write-Output "##vso[task.setvariable variable=PIPELINE_FILE_NAME]$pipelineFileName"
        Write-Output "##vso[task.setvariable variable=TARGET_DATE]$($targetDate.ToString('yyyy-MM-dd HH:mm:ss'))"
      displayName: 'Create Custom Production Pipeline'
    
    - powershell: |
        # Commit and push the new pipeline file
        cd "$(Build.SourcesDirectory)"
        
        git config user.email "azure-pipeline@dbmaestro.com"
        git config user.name "Azure DevOps Pipeline"
        
        git checkout main
        git pull origin main
        
        git add "$(PIPELINE_FILE_NAME)"
        git commit -m "Add scheduled production deployment for $(EXTRACTED_PACKAGE_NAME) [skip ci]"
        git push origin main
        
        Write-Host "Pipeline file committed and pushed to repository"
      displayName: 'Commit Pipeline File to Repository'
      env:
        SYSTEM_ACCESSTOKEN: $(System.AccessToken)
    
    - powershell: |
        # Wait for Azure DevOps to detect the new file
        Write-Host "Waiting for Azure DevOps to index the new pipeline file..."
        Start-Sleep -Seconds 15
        
        # Create pipeline via REST API
        $orgUrl = "$(System.CollectionUri)"
        $project = "$(System.TeamProject)"
        $pat = "$(System.AccessToken)"
        
        $headers = @{
          Authorization = "Bearer $pat"
          "Content-Type" = "application/json"
        }
        
        $pipelineName = "Deploy-PRD-$(EXTRACTED_PACKAGE_NAME)"
        $body = @{
          configuration = @{
            type = "yaml"
            path = "/$(PIPELINE_FILE_NAME)"
            repository = @{
              id = "$(Build.Repository.ID)"
              type = "azureReposGit"
            }
          }
          folder = "\\Production Deployments"
          name = $pipelineName
        } | ConvertTo-Json -Depth 10
        
        Write-Host "Creating pipeline: $pipelineName"
        Write-Host "YAML path: /$(PIPELINE_FILE_NAME)"
        
        try {
          $uri = "$orgUrl$project/_apis/pipelines?api-version=7.1-preview.1"
          $response = Invoke-RestMethod -Uri $uri -Method Post -Headers $headers -Body $body
          
          Write-Host ""
          Write-Host "=== Pipeline Created Successfully ===" -ForegroundColor Green
          Write-Host "Pipeline ID: $($response.id)"
          Write-Host "Pipeline Name: $($response.name)"
          Write-Host "Pipeline URL: $($response._links.web.href)"
          Write-Host ""
          Write-Host "Scheduled deployment: $(TARGET_DATE)"
          Write-Host "Package: $(EXTRACTED_PACKAGE_NAME)"
          Write-Host "Target Environment: PRD"
          Write-Host ""
          Write-Host "The pipeline will automatically run at the scheduled time."
          
        } catch {
          Write-Error "Failed to create pipeline: $($_.Exception.Message)"
          Write-Host "Response: $($_.Exception.Response)"
          exit 1
        }
      displayName: 'Register Pipeline in Azure DevOps'
    
    - script: |
        echo ===================================
        echo Production Upgrade Scheduled
        echo ===================================
        echo Package: $(EXTRACTED_PACKAGE_NAME)
        echo Target Environment: $(DBM_ENV_NAME_PROD)
        echo Scheduled Time: $(TARGET_DATE)
        echo Status: SCHEDULED (Automatic execution)
        echo ===================================
      displayName: 'Display Schedule Summary'

